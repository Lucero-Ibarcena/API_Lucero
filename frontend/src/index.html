<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f2f2" />
    <meta
      name="description"
      content="Una red para registrar mascotas, encontrarlas y cuidarlas en comunidad."
    />
    <title>Huellas — Una red para cuidarlos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a
          class="brand"
          href="/"
          aria-label="Huellas, inicio"
          data-view="inicio"
        >
          <span class="brand-mark icon-paw" aria-hidden="true"></span>
          <span class="brand-copy"
            ><strong>Huellas</strong><small>Una red para cuidarlos</small></span
          >
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Abrir navegación"
          aria-controls="site-nav"
          aria-expanded="false"
          data-action="toggle-nav"
        >
          <span class="icon icon-paw menu-paw" aria-hidden="true"></span
          ><span class="menu-label">Menú</span
          ><span class="visually-hidden">Abrir navegación</span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
          <div class="nav-drawer-heading">
            <strong>Huellas</strong
            ><button
              class="drawer-close"
              type="button"
              aria-label="Cerrar navegación"
              data-action="toggle-nav"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <a class="nav-link is-active" href="/app/inicio" data-view="inicio"
            >Inicio</a
          >
          <a class="nav-link" href="/app/mascotas" data-view="mias"
            >Mis mascotas</a
          >
          <a class="nav-link" href="/app/buscar" data-view="buscar">Buscar</a>
          <a class="nav-link" href="/app/avisos" data-view="perdidas">Avisos</a>
          <a class="nav-link" href="/app/servicios" data-view="servicios"
            >Servicios</a
          >
          <a class="nav-link" href="/app/cuenta" data-view="cuenta"
            >Comunidad</a
          >
          <a class="nav-link" href="/app/sobre" data-view="sobre"
            >Sobre Huellas</a
          >
        </nav>

        <div class="header-actions" id="session-actions"></div>
      </header>
      <button
        class="nav-scrim"
        type="button"
        aria-label="Cerrar navegación"
        tabindex="-1"
      ></button>

      <div id="notice" class="notice" aria-live="polite" hidden></div>
      <main id="content" class="content" aria-live="polite">
        <div class="loading-state">
          <span class="spinner"></span> Preparando tu espacio…
        </div>
      </main>
      <footer class="site-footer">
        <a class="footer-brand" href="/" data-view="inicio"
          ><span class="footer-mark icon-paw" aria-hidden="true"></span>
          Huellas · Juntos cuidamos más</a
        ><a href="/ayuda">Guía técnica de la API</a
        ><span>© Huellas · 2026</span>
      </footer>

      <nav class="mobile-nav" aria-label="Accesos rápidos">
        <button data-view="inicio">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1h-5.2v-6h-4.6v6H4.5a1 1 0 0 1-1-1v-9Z"
            /></svg
          ><span>Inicio</span>
        </button>
        <button data-view="buscar">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" />
            <path d="m16 16 4.5 4.5" /></svg
          ><span>Buscar</span>
        </button>
        <button data-action="report-public">
          <span class="mobile-add"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" /></svg></span
          ><span>Publicar</span>
        </button>
        <button data-view="guardados">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.6 8.6c0 5.2-8.6 11-8.6 11s-8.6-5.8-8.6-11A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.6 2.2Z"
            /></svg
          ><span>Guardados</span>
        </button>
        <button data-view="cuenta">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" /></svg
          ><span>Perfil</span>
        </button>
      </nav>
    </div>

    <dialog class="modal" id="modal">
      <button
        class="modal-close"
        type="button"
        aria-label="Cerrar"
        data-action="close-modal"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" /></svg
        ><span class="visually-hidden">Cerrar</span>
      </button>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
